apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusfs-ingress
  namespace: nexusfs
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  tls:
  - hosts:
    - api.nexusfs.example.com
    secretName: nexusfs-tls
  rules:
  - host: api.nexusfs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nexusfs-api-service
            port:
              number: 80

