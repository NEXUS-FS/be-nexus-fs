apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusfs-api
  namespace: nexusfs
  labels:
    app: nexusfs-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexusfs-api
  template:
    metadata:
      labels:
        app: nexusfs-api
    spec:
      containers:
      - name: nexusfs-api
        image: nexusfs/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: nexusfs-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: nexusfs-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: nexusfs-secrets
              key: DATABASE_URL
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: nexusfs-secrets
              key: REDIS_CONNECTION_STRING
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: nexusfs-secrets
              key: JWT_SECRET_KEY
        - name: JwtSettings__Issuer
          valueFrom:
            configMapKeyRef:
              name: nexusfs-config
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            configMapKeyRef:
              name: nexusfs-config
              key: JwtSettings__Audience
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nexusfs-api-service
  namespace: nexusfs
spec:
  selector:
    app: nexusfs-api
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: LoadBalancer

