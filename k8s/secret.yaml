apiVersion: v1
kind: Secret
metadata:
  name: nexusfs-secrets
  namespace: nexusfs
type: Opaque
stringData:
  # Database connection string (replace with actual values)
  DATABASE_URL: "Host=postgres-service;Port=5432;Database=nexusfs;Username=admin;Password=CHANGE_ME"
  
  # Redis connection string
  REDIS_CONNECTION_STRING: "redis-service:6379"
  
  # JWT Secret Key (replace with a strong secret)
  JWT_SECRET_KEY: "CHANGE_ME_TO_A_STRONG_SECRET_KEY_AT_LEAST_32_CHARACTERS"
  
  # AWS Credentials (if using S3)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  
  # Google Drive OAuth (if using Google Drive)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

