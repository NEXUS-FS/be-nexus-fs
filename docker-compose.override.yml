version: '3.8'

# Override file for development environment
# This file is automatically merged with docker-compose.yml

services:
  nexusfs-api:
    build:
      context: ./be-nexus-fs
      dockerfile: ../Dockerfile
      target: development
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      # Enable hot reload for development
      - ./be-nexus-fs:/app/source:ro
      - /app/source/bin
      - /app/source/obj
    command: dotnet watch run --project /app/source/be-nexus-fs/be-nexus-fs.csproj

  # Add Adminer for database management in development
  adminer:
    image: adminer:latest
    container_name: nexusfs-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - nexusfs-network

  # Add Redis Commander for Redis management in development
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nexusfs-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - nexusfs-network

